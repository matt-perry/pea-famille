# Robot du soir : récupère les cours de clôture chez Yahoo Finance et les enregistre (chiffrés).
# Toutes les 15 minutes de 17 h à 21 h 59 UTC, du lundi au vendredi.
# Le script ne travaille réellement qu'entre 19 h 40 et 23 h (Paris) les jours de séance Euronext.
# Lancement manuel (Actions › Robot du soir › Run workflow) : récupère tout l'historique manquant.
name: Robot du soir

on:
  schedule:
    - cron: '7,22,37,52 17-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-du-soir
  cancel-in-progress: false

jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - name: Installer yfinance
        continue-on-error: true
        run: pip install --quiet --disable-pip-version-check -r robot/requirements.txt
      - run: npm ci
      - name: Récupérer les cours
        id: robot
        run: npx tsx robot/fetch-prices.ts
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Enregistrer dans le dépôt
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "robot-pea-famille"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: cours du $(TZ=Europe/Paris date +%F)"
            git push
          else
            echo "Aucun changement."
          fi# Robot du soir : récupère les cours de clôture chez EODHD et les enregistre (chiffrés).
